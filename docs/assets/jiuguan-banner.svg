    <rect x="4" y="125" width="760" height="4" rx="2" fill="url(#gold)" opacity="0.9"/>
    <text x="2" y="190" fill="#e9d5ff" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="40" font-weight="600">酒馆 · 可控多 Agent 角色扮演平台</text>
    <text x="3" y="241" fill="#aeb7cf" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="25">本地优先 · 上下文编排 · 私有多端 · 有界自主</text>

    <g transform="translate(2 282)" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="20" font-weight="600">

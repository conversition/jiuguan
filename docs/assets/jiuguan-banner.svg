      <text x="88" y="32" fill="#ddd6fe" text-anchor="middle">LOCAL FIRST</text>

      <rect x="194" width="190" height="50" rx="25" fill="#0ea5e9" fill-opacity="0.15" stroke="#38bdf8" stroke-opacity="0.55"/>
      <text x="289" y="32" fill="#bae6fd" text-anchor="middle">FAIL CLOSED</text>

      <rect x="402" width="232" height="50" rx="25" fill="#f59e0b" fill-opacity="0.12" stroke="#fbbf24" stroke-opacity="0.55"/>
      <text x="518" y="32" fill="#fde68a" text-anchor="middle">USER CONTROLLED</text>

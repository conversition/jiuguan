    </filter>
  </defs>

  <rect width="1600" height="520" rx="38" fill="url(#bg)"/>
  <rect width="1600" height="520" rx="38" fill="url(#violetGlow)"/>
  <rect width="1600" height="520" rx="38" fill="url(#amberGlow)"/>
  <rect x="1" y="1" width="1598" height="518" rx="37" fill="none" stroke="#c4b5fd" stroke-opacity="0.22" stroke-width="2"/>
  <rect width="1600" height="520" rx="38" fill="url(#grid)"/>

  <g opacity="0.55">
    <circle cx="1435" cy="90" r="5" fill="#fde68a"/>
    <circle cx="1490" cy="165" r="3" fill="#a78bfa"/>
    <circle cx="1370" cy="220" r="4" fill="#38bdf8"/>
    <path d="M1370 220L1435 90L1490 165" fill="none" stroke="#a78bfa" stroke-opacity="0.35"/>
  </g>

  <g transform="translate(120 72)" filter="url(#shadow)">
    <rect width="330" height="376" rx="64" fill="#0f1328" fill-opacity="0.9" stroke="#a78bfa" stroke-opacity="0.35" stroke-width="2"/>
    <path d="M77 286V143C77 93 116 53 165 53s88 40 88 90v143" fill="none" stroke="url(#mark)" stroke-width="24" stroke-linecap="round"/>
    <path d="M113 286V151c0-29 23-53 52-53s52 24 52 53v135" fill="#151936" stroke="#f8fafc" stroke-opacity="0.78" stroke-width="6"/>
    <path d="M165 108v178" stroke="#c4b5fd" stroke-opacity="0.35" stroke-width="3"/>
    <circle cx="192" cy="196" r="7" fill="#fde68a"/>
    <path d="M64 303h202" stroke="url(#gold)" stroke-width="9" stroke-linecap="round"/>

    <g fill="#38bdf8">
      <circle cx="45" cy="93" r="9"/>
      <circle cx="285" cy="98" r="9"/>
      <circle cx="41" cy="252" r="9"/>
      <circle cx="289" cy="253" r="9"/>
    </g>
    <g fill="none" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="3">
      <path d="M52 98l49 28"/>
      <path d="M278 103l-49 28"/>
      <path d="M49 248l48-31"/>
      <path d="M281 249l-48-31"/>
    </g>
    <circle cx="165" cy="194" r="26" fill="#8b5cf6" fill-opacity="0.18" filter="url(#softGlow)"/>
  </g>


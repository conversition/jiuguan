name: 功能建议
description: 提议一个有明确使用场景的新功能或改进
title: "[Feature] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        请先说明实际场景和用户价值，再描述你想到的实现。不要附带私人角色卡或会话内容。

  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 谁在什么情况下遇到了什么问题？
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 描述期望的交互和结果，不必限定内部实现。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 已尝试的替代方案

  - type: textarea
    id: safety
    attributes:
      label: 成本与安全边界
      description: 如果涉及模型调用、后台任务、自动写入或远程访问，请说明预算、授权与回滚预期。

  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我没有在本 Issue 中提交 Key、凭据、私人会话或用户资产。
          required: true
